# native-hello tests: exercise ryra's native (non-podman) runtime end to end:
# compile the source, run the binary under systemd --user, serve HTTP, and log
# visits to the service data dir. This is the only `runtime = "native"` service
# and exists purely to test that path.
#
# Basic checks: setup is the default add + wait (the add compiles the binary
# via cargo build --release; the synthesized 300s add timeout covers it).
[[tests]]
name = "native-hello"
[[tests.checks]]
action = "http"
name = "responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/"
service = "native-hello"
poll = { interval = 1, attempts = 30 }
timeout = 60
[[tests.checks]]
action = "shell"
name = "says-hello"
run = """set -e
. ${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello/.env
curl -s "http://127.0.0.1:$SERVICE_PORT_HTTP/" | grep -q 'hello world'
"""
[[tests.checks]]
action = "shell"
name = "logs-visits"
run = """set -e
SVC=${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello
. $SVC/.env
curl -s -H 'X-Probe: ryra-test' "http://127.0.0.1:$SERVICE_PORT_HTTP/" >/dev/null
grep -q 'X-Probe: ryra-test' "$SVC/data/visits.log"
"""
[[tests.checks]]
action = "shell"
name = "runs-as-unit"
run = "systemctl --user is-active native-hello | grep -q active"

# Inner-loop test: editing the source and running `ryra upgrade` rebuilds from
# source and reloads the live service. Runs in one step under a trap that always
# restores the source, so a failed assertion can't leave the registry dirty.
# Stays a lifecycle test: it edits registry source and runs `ryra upgrade`.
[[tests]]
name = "upgrade"
[[tests.steps]]
action = "add"
service = "native-hello"
timeout = 120
[[tests.steps]]
action = "wait"
service = "native-hello"
[[tests.steps]]
action = "shell"
name = "edit-upgrade-reload"
run = """set -e
SRC="$RYRA_REGISTRY_DIR/native-hello/src/main.rs"
test -f "$SRC"
cp "$SRC" /tmp/native-hello-main.bak
# Restore the source no matter how this step exits (pass or fail).
trap 'cp /tmp/native-hello-main.bak "$SRC"' EXIT

. ${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello/.env
URL="http://127.0.0.1:$SERVICE_PORT_HTTP/"

# Baseline: stock response.
curl -s "$URL" | grep -q 'hello world'

# Edit the source and upgrade; the live service must now serve the edit.
sed -i 's/hello world/hello UPGRADED/' "$SRC"
ryra upgrade native-hello -y
for _ in $(seq 1 15); do
  curl -s "$URL" 2>/dev/null | grep -q 'hello UPGRADED' && break
  sleep 1
done
curl -s "$URL" | grep -q 'hello UPGRADED'

# A second upgrade (source unchanged) is a cheap rebuild + restart; still serves.
ryra upgrade native-hello -y
for _ in $(seq 1 15); do
  curl -s "$URL" 2>/dev/null | grep -q 'hello UPGRADED' && break
  sleep 1
done
curl -s "$URL" | grep -q 'hello UPGRADED'
"""
timeout = 180
