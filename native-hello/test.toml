# native-hello tests — exercise ryra's native (non-podman) runtime end to end:
# compile the source, run the binary under systemd --user, serve HTTP, and log
# visits to the service data dir. This is the only `runtime = "native"` service
# and exists purely to test that path.

[[tests]]
name = "native-hello"
[[tests.steps]]
action = "add"
service = "native-hello"
# First add compiles the binary (cargo build --release).
timeout = 120
[[tests.steps]]
action = "wait"
service = "native-hello"
[[tests.steps]]
action = "http"
name = "responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/"
service = "native-hello"
poll = { interval = 1, attempts = 30 }
timeout = 60
[[tests.steps]]
action = "shell"
name = "says-hello"
run = """set -e
. ${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello/.env
curl -s "http://127.0.0.1:$SERVICE_PORT_HTTP/" | grep -q 'hello world'
"""
[[tests.steps]]
action = "shell"
name = "logs-visits"
run = """set -e
SVC=${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello
. $SVC/.env
curl -s -H 'X-Probe: ryra-test' "http://127.0.0.1:$SERVICE_PORT_HTTP/" >/dev/null
grep -q 'X-Probe: ryra-test' "$SVC/data/visits.log"
"""
[[tests.steps]]
action = "shell"
name = "binary-installed"
run = "test -x ${RYRA_DATA_DIR:-$HOME/.local/share/services}/native-hello/bin/native-hello"
