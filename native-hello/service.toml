# A "native" service: ryra compiles the source in this folder and runs the
# resulting binary directly under systemd --user (no container image). The
# service still gets the full ryra contract via env: SERVICE_PORT_HTTP for the
# port, SERVICE_HOME for its data dir, and (later) auth/SMTP/db mappings.
#
# NOTE: `runtime = "native"` + `[build]` are not implemented in core yet — this
# file defines the contract we're building toward.

[service]
name = "native-hello"
description = "Minimal std-only HTTP server: says hello, logs visitors + headers. Demonstrates native (non-podman) services."
runtime = "native"

# Build pipeline: run `command` in this folder, install `bin` into the service
# home as the ExecStart target.
[build]
command = "cargo build --release"
bin = "target/release/native-hello"

# Same port model as container services: ryra allocates a host port and exposes
# it to the process as SERVICE_PORT_HTTP.
[[ports]]
name = "http"
container_port = 3000

# Opt into ryra backups. No [backup] section, so the whole service folder is
# snapshotted (config + the data/ state). Proves the whole-folder backup model
# is runtime-agnostic — a native service backs up and restores like any other.
[integrations]
backup = true
