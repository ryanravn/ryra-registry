# A "native" service: ryra runs the `run` command directly under systemd --user
# (no container image), in this folder. The service still gets the full ryra
# contract via env: SERVICE_PORT_HTTP for the port, SERVICE_HOME for its data
# dir, and (later) auth/SMTP/db mappings.

[service]
name = "native-hello"
description = "Minimal std-only HTTP server: says hello, logs visitors + headers. Demonstrates native (non-podman) services."
runtime = "native"
# `build` (optional) runs in this folder, then ryra runs `run` directly under
# systemd --user (in this folder) with SERVICE_PORT_HTTP + SERVICE_HOME injected.
# An interpreted service would instead be e.g. run = "bun --watch run src/index.ts"
# with no build step.
build = "cargo build --release"
run = "target/release/native-hello"

# Same port model as container services: ryra allocates a host port and exposes
# it to the process as SERVICE_PORT_HTTP.
[[ports]]
name = "http"
container_port = 3000

# Opt into ryra backups. No [backup] section, so the whole service folder is
# snapshotted (config + the data/ state). Proves the whole-folder backup model
# is runtime-agnostic: a native service backs up and restores like any other.
[integrations]
backup = true
