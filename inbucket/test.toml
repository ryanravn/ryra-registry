# inbucket tests — basic install + web UI probe.
# Inbucket is the dev SMTP sink used by other services' --smtp=inbucket
# tests; the SMTP side is covered by those. This file just asserts the
# container starts and serves its web UI. Setup is the default add + wait.

[[tests]]
name = "inbucket"
services = ["inbucket"]
[[tests.checks]]
action = "http"
name = "web-ui-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "inbucket"
poll = { interval = 2, attempts = 30 }
timeout = 90
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/inbucket"
