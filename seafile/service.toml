[service]
name = "seafile"
description = "Seafile - file sync and share server"
category = "storage"
tags = ["files", "sync"]
url = "https://www.seafile.com/"
architecture = ["amd64", "arm64"]
https = "always"

[requirements.ram]
min = 1024
recommended = 2048

[[ports]]
name = "http"
container_port = 80

# --- MariaDB env vars ---

[[env]]
name = "MYSQL_LOG_CONSOLE"
value = "true"

# --- Database: bundled MariaDB (default) or bring your own. ---
#     internal: the seafile-mariadb.container sidecar (alias `mariadb`); the
#         MYSQL_ROOT_PASSWORD init vars and seafile's connection share the .env.
#         Seafile talks to mariadb over the podman network, so there's no
#         published port to gate.
#     external: the sidecar is never symlinked or pulled; point seafile at an
#         existing MariaDB/MySQL.
# Seafile 13.x reads SEAFILE_MYSQL_DB_HOST and INIT_SEAFILE_MYSQL_ROOT_PASSWORD
# in wait_for_mysql() (utils.py) and bootstrap.py. Older tutorials referenced
# DB_HOST/DB_ROOT_PASSWD, but those are ignored by the 13.x image and cause
# the container to poll `db:3306` forever.
[[choice]]
name = "database"
prompt = "Database"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled MariaDB (managed quadlet)"
quadlets = ["seafile-mariadb.container"]
# Container-init vars, read by the sidecar from the shared .env.
[[choice.option.env]]
name = "MYSQL_ROOT_PASSWORD"
value = "{{secret.mysql_root_password}}"
[[choice.option.env]]
name = "INIT_SEAFILE_MYSQL_ROOT_PASSWORD"
value = "{{secret.mysql_root_password}}"
# Seafile's connection, pointed at the sidecar.
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_HOST"
value = "mariadb"
# Required by seafdav's seahub_db init (thirdpart/wsgidav/dc/seahub_db.py).
# Without this, `os.environ.get('SEAFILE_MYSQL_DB_PORT')` returns None, the
# in-code default never kicks in (`int(None)` raises before the second
# `.get` default), the seahub session fails to initialize, and every
# WebDAV request authenticated via `ENABLE_WEBDAV_SECRET` short-circuits
# to 401 — silently, with no useful error in seafdav.log beyond a one-time
# "Failed to init seahub db" warning at startup. Static value because the
# in-container mariadb always listens on 3306 (the host port doesn't matter
# to seafile — it talks to mariadb over the podman network).
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_PORT"
value = "3306"
# seaf-server (the C binary) reads SEAFILE_MYSQL_DB_USER/PASSWORD from the
# environment directly — they are not stored in any config file. Both setup
# (bootstrap.py creates the user) and runtime (seaf-server authenticates) read
# these, so they must be persistent across restarts.
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_USER"
value = "seafile"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_PASSWORD"
value = "{{secret.mysql_seafile_password}}"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_CCNET_DB_NAME"
value = "ccnet_db"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_SEAFILE_DB_NAME"
value = "seafile_db"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_SEAHUB_DB_NAME"
value = "seahub_db"

[[choice.option]]
name = "external"
label = "External MariaDB/MySQL (bring your own)"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_HOST"
value = ""
kind = "required"
prompt = "MySQL host"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_PORT"
value = "3306"
kind = "prompted"
prompt = "MySQL port"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_USER"
value = "seafile"
kind = "prompted"
prompt = "MySQL username"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_PASSWORD"
value = ""
kind = "required"
prompt = "MySQL password"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_CCNET_DB_NAME"
value = "ccnet_db"
kind = "prompted"
prompt = "Ccnet database name"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_SEAFILE_DB_NAME"
value = "seafile_db"
kind = "prompted"
prompt = "Seafile database name"
[[choice.option.env]]
name = "SEAFILE_MYSQL_DB_SEAHUB_DB_NAME"
value = "seahub_db"
kind = "prompted"
prompt = "Seahub database name"

# --- Seafile server config ---

[[env]]
# Seafile builds frontend asset URLs by concatenating SCHEME + HOSTNAME
# + path. Hardcoding `:service.port` emits `https://<host>:10001/media/…`,
# but the local container publish port isn't reachable from the tailnet
# or Caddy — the public route terminates on :443 (or caddy_https_port).
# Use external_authority so the port is included only when the URL has
# an explicit one; fall back to 127.0.0.1:<port> for the no-URL case.
name = "SEAFILE_SERVER_HOSTNAME"
value = "{{service.external_authority | default('127.0.0.1:' ~ service.port)}}"

[[env]]
name = "SEAFILE_SERVER_PROTOCOL"
value = "{{service.scheme}}"

[[env]]
name = "JWT_PRIVATE_KEY"
value = "{{secret.jwt_key}}"
format = "hex"
length = 32

[[env]]
name = "INIT_SEAFILE_ADMIN_EMAIL"
value = "{{admin.email | default('admin@example.com')}}"
kind = "prompted"
prompt = "Admin email"

[[env]]
name = "INIT_SEAFILE_ADMIN_PASSWORD"
value = "{{secret.admin_password}}"
kind = "prompted"
prompt = "Admin password"

# --- Redis cache ---

[[env]]
name = "CACHE_PROVIDER"
value = "redis"

# --- OIDC account identity model ---
# Controls how Seafile derives the *username* for SSO-provisioned accounts.
# configs/scripts/inject-oauth.sh reads OAUTH_IDENTITY_SOURCE and writes the
# matching OAUTH_ATTRIBUTE_MAP into seahub_settings.py. Only relevant when an
# OIDC provider is wired up; harmless otherwise.
#
#   uid (default): SSO accounts are keyed on the immutable OIDC `sub`
#       (`<sub>@auth.local` usernames); the email is stored as contact_email.
#       Stable across email changes. Footgun: if a native account already owns
#       that email (e.g. the INIT_SEAFILE_ADMIN_EMAIL admin), email login
#       resolves to the SSO account via contact_email and the native account is
#       shadowed — "Incorrect email or password" despite a correct password.
#   email: the SSO account username IS the IdP email, so it coincides with a
#       native account of the same address (no `@auth.local`, no shadowing).
#       Trade-off: email is mutable, so a changed IdP address orphans the
#       account. Switching uid->email on a live deployment re-provisions existing
#       SSO users as new accounts on next login — pick before first SSO login.
[[choice]]
name = "oidc_identity"
prompt = "OIDC account identity (how SSO usernames are derived)"
default = "uid"

[[choice.option]]
name = "uid"
label = "Stable subject ID (recommended) — SSO users get <sub>@auth.local usernames"
[[choice.option.env]]
name = "OAUTH_IDENTITY_SOURCE"
value = "uid"

[[choice.option]]
name = "email"
label = "IdP email — SSO account username is the email (email login matches it)"
[[choice.option.env]]
name = "OAUTH_IDENTITY_SOURCE"
value = "email"

# --- Auth integration ---
# Seafile reads OAuth config from seahub_settings.py (a Python file), not env
# vars. The auth mappings below write OAUTH_* vars into the .env file.
# Config scripts in configs/ handle OAuth injection into seahub_settings.py.

[integrations]
auth = ["oidc"]
token_auth_method = "client_secret_basic"
oidc_callbacks = ["/oauth/callback/"]
smtp = true
# Online backup: backup-pre.sh runs `mariadb-dump --single-transaction`
# inside the live mariadb container (InnoDB-consistent snapshot, no
# table locks, no service downtime), writing the three seafile
# databases to .backup/all-dbs.sql. Restic then snapshots the live
# shared/ tree alongside the dump. Seafile's blob storage is
# content-addressable so concurrent writes during restic produce
# extra blocks the next snapshot picks up; the upstream docs bless
# this order (SQL first, data dir second) and `seaf-fsck` reconciles
# any unreferenced blocks. Mariadb's raw datadir (db-data/) is *not*
# snapshotted: the SQL dump replaces it, and restoring a live
# datadir into a stopped one is fragile across mariadb minor
# versions anyway. Redis is regenerable cache and excluded.
backup = true

[backup]
# Online backup: backup-pre.sh takes a live mariadb-dump (single-transaction)
# and restic snapshots the content-addressable shared/ tree alongside it, with
# no service stop. ryra runs only the hooks here -- it never stops, chowns, or
# wipes -- so seafile keeps its own restore (pause seahub, re-import the dump).
online = true
paths = ["shared", ".backup"]

[mappings.smtp]
SMTP_HOST = "{{smtp.host}}"
SMTP_PORT = "{{smtp.port}}"
SMTP_USERNAME = "{{smtp.username}}"
SMTP_PASSWORD = "{{smtp.password}}"
SMTP_FROM = "{{smtp.from}}"
SMTP_SECURITY = "{{smtp.security}}"

[mappings.auth]
OAUTH_CLIENT_ID = "{{auth.client_id}}"
OAUTH_CLIENT_SECRET = "{{auth.client_secret}}"
OAUTH_REDIRECT_URL = "{{service.external_url}}/oauth/callback/"
OAUTH_PROVIDER_DOMAIN = "{{auth.external_url}}"
OAUTH_INTERNAL_DOMAIN = "{{auth.external_url}}"

# Autoupdate hint (registry tooling only, the box never self-updates).
# Upstream GitHub releases do not map cleanly to the seafile-mc image,
# so follow the image's own registry tags.
[autoupdate]
strategy = "registry-tags"
tag_regex = '^(\d+\.\d+\.\d+)$'
