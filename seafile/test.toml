# seafile tests — SMTP delivery + OIDC browser SSO flow.
#
# There is no stand-alone "basic install" test for seafile: the service
# requires a domain (Caddy) to even come up, so the simplest meaningful
# test is already the SMTP flow below.

# SMTP via seahub's `manage.py sendtestemail`. Seafile's Python shim
# needs PYTHONPATH + several SEAFILE_* env vars that `seahub.sh` would
# normally set; we recreate them inline. Stays a lifecycle test: `mail`
# reads the inbucket fixture.
[[tests]]
name = "seafile-smtp"
[[tests.steps]]
action = "add"
service = "caddy"
[[tests.steps]]
action = "wait"
service = "caddy"
[[tests.steps]]
action = "add"
service = "seafile"
args = "--smtp=inbucket --url https://seafile.internal:8443"
env = { INIT_SEAFILE_ADMIN_EMAIL = "smtptest@example.com", INIT_SEAFILE_ADMIN_PASSWORD = "Testing-Smtp-123!" }
timeout = 900
[[tests.steps]]
action = "wait"
service = "seafile"
[[tests.steps]]
action = "http"
name = "seafile-responds"
# ${SERVICE_URL} is the install's CONFIGURED exposure (the fixture URL
# in sandbox runs, the box's real URL in live mode). Checks must never
# hardcode the fixture: live mode replays them against real installs.
url = "${SERVICE_URL}"
service = "seafile"
poll = { interval = 3, attempts = 60 }
timeout = 240
[[tests.steps]]
# SeafDAV returns 401 when unauthenticated. Proves the WebDAV endpoint
# is enabled and routed through the image's built-in proxy.
action = "http"
name = "seafdav-requires-auth"
url = "${SERVICE_URL}/seafdav/"
status = 401
service = "seafile"
poll = { interval = 3, attempts = 60 }
timeout = 240
[[tests.steps]]
action = "shell"
name = "trigger-smtp-mail"
run = """for i in $(seq 1 10); do
  podman exec seafile bash -c '
    INSTALLPATH=/opt/seafile/seafile-server-latest
    TOPDIR=/opt/seafile
    export PYTHONPATH=${INSTALLPATH}/seafile/lib/python3/site-packages:${INSTALLPATH}/seafile/lib64/python3/site-packages:${INSTALLPATH}/seahub:${INSTALLPATH}/seahub/thirdpart:${INSTALLPATH}/pro/python
    export SEAFES_DIR=${INSTALLPATH}/pro/python/seafes
    export SEAHUB_DIR=${INSTALLPATH}/seahub
    export SEAFILE_CENTRAL_CONF_DIR=${TOPDIR}/conf
    export CCNET_CONF_DIR=${TOPDIR}/ccnet
    export SEAFILE_CONF_DIR=${TOPDIR}/seafile-data
    export SEAFILE_DATA_DIR=${TOPDIR}/seafile-data
    export DJANGO_SETTINGS_MODULE=seahub.settings
    cd ${INSTALLPATH}
    python3 seahub/manage.py sendtestemail smtptest@example.com
  ' && exit 0
  sleep 3
done
exit 1"""
timeout = 90
[[tests.steps]]
action = "mail"
name = "mail-delivered-to-inbucket"
mailbox = "smtptest"
contains = "Test email from"
timeout = 90

# OIDC browser flow — seafile goes through caddy over HTTPS. Explicit
# setup: adds carry args/env and there are three services. The login
# flow is live-safe.

[[tests.steps]]
# seaf-fuse: a file uploaded through the API must be readable through
# the read-only fuse mount inside the container. This is the contract
# the box agent (and any indexer) depends on for search.
action = "shell"
name = "fuse-exposes-uploaded-file"
timeout = 180
run = '''
set -e
D=${RYRA_DATA_DIR:-$HOME/.local/share/services}
. $D/seafile/.env
SF=http://127.0.0.1:$SERVICE_PORT_HTTP
TOK=$(curl -sf -d "username=$INIT_SEAFILE_ADMIN_EMAIL" -d "password=$INIT_SEAFILE_ADMIN_PASSWORD" $SF/api2/auth-token/ | python3 -c "import json,sys; print(json.load(sys.stdin)[\"token\"])")
REPO=$(curl -sf -X POST -H "Authorization: Token $TOK" -d "name=fuse-probe" $SF/api2/repos/ | python3 -c "import json,sys; print(json.load(sys.stdin)[\"repo_id\"])")
echo "the fuse marker FUSEPROBE42" > /tmp/fuseprobe.txt
UP=$(curl -sf -H "Authorization: Token $TOK" "$SF/api2/repos/$REPO/upload-link/" | tr -d '"')
HP=$(python3 -c "import urllib.parse,sys; u=urllib.parse.urlparse(sys.argv[1]); print(str(u.hostname)+chr(58)+str(u.port or 443))" "$UP")
# -k: TLS verification is not this check's subject (the https checks
# above cover the route); the CA export only exists in suite tests.
curl -sfk --resolve "$HP:127.0.0.1" -F file=@/tmp/fuseprobe.txt -F parent_dir=/ "$UP" > /dev/null
# The fuse tree is /seaf-fuse/<user>/<repo-id>_<repo-name>/...; poll a
# few times, the mount refreshes lazily on first traversal.
for i in $(seq 1 12); do
  if podman exec seafile sh -c "grep -rs FUSEPROBE42 /seaf-fuse" >/dev/null 2>&1; then
    echo "fuse mount serves the uploaded file"
    exit 0
  fi
  sleep 5
done
echo "uploaded file never appeared under /seaf-fuse:"
podman exec seafile sh -c "ls -R /seaf-fuse 2>&1 | head -20"
exit 1
'''

[[tests]]
name = "seafile-oidc"
browser = true
[[tests.setup]]
action = "add"
service = "caddy"
[[tests.setup]]
action = "wait"
service = "caddy"
[[tests.setup]]
action = "add"
service = "authelia"
args = "--url https://auth.internal:8443"
env = { AUTHELIA_ADMIN_USER = "testuser", AUTHELIA_ADMIN_PASSWORD = "testpassword123" }
timeout = 300
[[tests.setup]]
action = "wait"
service = "authelia"
[[tests.setup]]
action = "add"
service = "seafile"
args = "--auth --url https://seafile.internal:8443"
env = { INIT_SEAFILE_ADMIN_EMAIL = "admin@example.com", INIT_SEAFILE_ADMIN_PASSWORD = "testpassword123" }
timeout = 900
[[tests.setup]]
action = "wait"
service = "seafile"
[[tests.checks]]
action = "http"
name = "seafile-http-ready"
url = "${SERVICE_URL}"
service = "seafile"
poll = { interval = 5, attempts = 60 }
timeout = 360
[[tests.checks]]
action = "playwright"
name = "playwright-sso"
spec = "seafile-auth.spec.ts"
timeout = 120
env = { SEAFILE_DOMAIN = "seafile.internal:8443", AUTHELIA_USER = "testuser", AUTHELIA_PASSWORD = "testpassword123" }
