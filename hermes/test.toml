# hermes tests: install only, no model keys (an empty-key install is
# valid). /health is the unauthenticated aliveness signal; real endpoints
# require the generated API key, which the 401 check proves is enforced.

[[tests]]
name = "hermes"
ram = 2048
[[tests.checks]]
action = "http"
name = "gateway-healthy"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/health"
service = "hermes"
poll = { interval = 3, attempts = 40 }
timeout = 180
[[tests.checks]]
action = "shell"
name = "api-key-enforced"
# service = sources hermes's .env (ports, generated key) framework-side,
# so the command is identical in sandboxed and live runs.
service = "hermes"
run = "test \"$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$SERVICE_PORT_HTTP/v1/models)\" = 401"
[[tests.checks]]
action = "shell"
name = "api-key-accepted"
# The generated key must actually open the door, not just its absence
# close it: /v1/models with the key from .env answers 2xx.
service = "hermes"
run = "c=$(curl -s -o /dev/null -w '%{http_code}' -H \"Authorization: Bearer $API_SERVER_KEY\" http://127.0.0.1:$SERVICE_PORT_HTTP/v1/models); case $c in 2*) exit 0;; *) echo \"got $c\" >&2; exit 1;; esac"
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/hermes/data"

# Opt-in dashboard: provisioned basic auth lets it bind non-loopback, and
# anonymous requests are gated behind its login redirect.
[[tests]]
name = "hermes-dashboard"
ram = 2048
[[tests.setup]]
action = "add"
service = "hermes"
env = { HERMES_DASHBOARD = "1" }
[[tests.setup]]
action = "wait"
service = "hermes"
[[tests.checks]]
action = "http"
name = "gateway-healthy"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/health"
service = "hermes"
poll = { interval = 3, attempts = 40 }
timeout = 180
[[tests.checks]]
action = "shell"
name = "dashboard-gated"
run = ". ${RYRA_DATA_DIR:-$HOME/.local/share/services}/hermes/.env; r=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:$SERVICE_PORT_WEB/); case $r in *auth/login*) exit 0;; *) echo \"redirect was: $r\" >&2; exit 1;; esac"
[[tests.checks]]
action = "shell"
name = "dashboard-login-page"
run = ". ${RYRA_DATA_DIR:-$HOME/.local/share/services}/hermes/.env; test \"$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$SERVICE_PORT_WEB/login)\" = 200"
