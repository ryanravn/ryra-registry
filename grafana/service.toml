[service]
name = "grafana"
description = "Grafana - dashboards and visualization for metrics and logs"
url = "https://grafana.com/docs/grafana/latest/"
architecture = ["amd64", "arm64"]

[requirements.ram]
min = 256
recommended = 512

[[ports]]
name = "http"
container_port = 3000

# Grafana builds absolute links (alerts, invites, OAuth redirects) from
# root_url. Falls back to http://127.0.0.1:<port> when no --url is given.
[[env]]
name = "GF_SERVER_ROOT_URL"
value = "{{service.external_url}}"

# --- Admin account (created on first boot; replaces the admin/admin
# default and its forced password-change screen) ---

[[env]]
name = "GF_SECURITY_ADMIN_USER"
value = "admin"
kind = "prompted"
prompt = "Admin username"

[[env]]
name = "GF_SECURITY_ADMIN_PASSWORD"
value = "{{secret.admin_password}}"
kind = "prompted"
prompt = "Admin password"

[[env]]
name = "GF_SECURITY_ADMIN_EMAIL"
value = "{{admin.email | default('admin@example.com')}}"

[integrations]
auth = []
smtp = true
# Sqlite-backed (data/grafana.db). Stop, snapshot, start.
backup = true

[backup]
paths = ["data"]

# Grafana wants host:port in one var. GF_SMTP_STARTTLS_POLICY is left at
# its default (opportunistic): plaintext sinks like inbucket work, and
# servers advertising STARTTLS get upgraded automatically.
[mappings.smtp]
GF_SMTP_ENABLED = "true"
GF_SMTP_HOST = "{{smtp.host}}:{{smtp.port}}"
GF_SMTP_USER = "{{smtp.username}}"
GF_SMTP_PASSWORD = "{{smtp.password}}"
GF_SMTP_FROM_ADDRESS = "{{smtp.from}}"
