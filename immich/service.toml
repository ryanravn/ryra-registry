[service]
name = "immich"
description = "Immich - self-hosted photo & video management"
category = "media"
tags = ["photos", "backup"]
url = "https://immich.app/"
architecture = ["amd64", "arm64"]
https = "auth"

[requirements.ram]
min = 1024
# Immich bundles a photo server, postgres, valkey, and a Python ML model
# loader. At boot, the main immich process alone RSSes ~2.2GB; add
# postgres shared_buffers + workers + ML model + kernel/page-cache
# headroom and the VM gets OOM-killed under ~6GB. Test VMs are sized
# off `recommended + 512MB` so aim for plenty of headroom here.
recommended = 6144

[[ports]]
name = "http"
container_port = 2283

# --- Environment variables ---

[[env]]
name = "REDIS_HOSTNAME"
value = "valkey"

# --- Database: bundled Postgres (default) or bring your own. ---
#     internal: the immich-postgres.container sidecar (on immich.network as
#         `postgres`), its password the shared {{secret.db_password}} both it
#         and immich read from the one .env.
#     external: the sidecar is never symlinked or pulled; point immich at an
#         existing Postgres. immich pins a custom postgres image with
#         VectorChord/pgvecto.rs extensions, so an external server must
#         provide those.
[[choice]]
name = "database"
prompt = "Database"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled Postgres (managed sidecar)"
quadlets = ["immich-postgres.container"]
[[choice.option.env]]
name = "DB_HOSTNAME"
value = "postgres"
[[choice.option.env]]
name = "DB_USERNAME"
value = "postgres"
[[choice.option.env]]
name = "DB_DATABASE_NAME"
value = "immich"
[[choice.option.env]]
name = "DB_PASSWORD"
value = "{{secret.db_password}}"

[[choice.option]]
name = "external"
label = "External Postgres (bring your own; needs VectorChord/pgvecto.rs)"
[[choice.option.env]]
name = "DB_HOSTNAME"
value = ""
kind = "required"
prompt = "Postgres host"
[[choice.option.env]]
name = "DB_USERNAME"
value = "immich"
kind = "prompted"
prompt = "Postgres username"
[[choice.option.env]]
name = "DB_DATABASE_NAME"
value = "immich"
kind = "prompted"
prompt = "Postgres database name"
[[choice.option.env]]
name = "DB_PASSWORD"
value = ""
kind = "required"
prompt = "Postgres password"

[[env]]
name = "IMMICH_MACHINE_LEARNING_URL"
value = "http://machine-learning:3003"

[[env]]
name = "INIT_IMMICH_ADMIN_EMAIL"
value = "{{admin.email | default('admin@example.com')}}"
kind = "prompted"
prompt = "Admin email"

[[env]]
name = "INIT_IMMICH_ADMIN_PASSWORD"
value = "{{secret.admin_password}}"
kind = "prompted"
prompt = "Admin password"

# --- Auth integration ---
# Immich configures OIDC via its admin API (PUT /system-config), not env vars.
# Config scripts in configs/ handle admin user creation and OIDC setup.

[integrations]
auth = ["oidc"]
oidc_callbacks = ["/auth/login"]
smtp = false
# File-level backup of db-data (postgres) + upload (user-uploaded
# photos). The ML model-cache is regenerable on first use and the
# valkey volume is cache + transient job state, so both are
# excluded from the snapshot.
backup = true

[backup]
paths = ["db-data", "upload"]

[mappings.auth]
OAUTH_CLIENT_ID = "{{auth.client_id}}"
OAUTH_CLIENT_SECRET = "{{auth.client_secret}}"
OAUTH_ISSUER_URL = "{{auth.issuer}}"
OAUTH_REDIRECT_URL = "{{service.external_url}}/auth/login"
OAUTHLIB_INSECURE_TRANSPORT = "1"
NODE_TLS_REJECT_UNAUTHORIZED = "0"

# Autoupdate hint (registry tooling only, the box never self-updates).
# The capture keeps the v prefix because the immich image tags carry it.
# Only the immich-server and immich-machine-learning tags are bumped;
# the pinned postgres and valkey images never match the version string.
[autoupdate]
strategy = "github-release"
repo = "immich-app/immich"
tag_regex = '^(v\d+\.\d+\.\d+)$'
