[service]
name = "synapse"
description = "Matrix homeserver (Synapse) + Element web client"
url = "https://element-hq.github.io/synapse/"
architecture = ["amd64", "arm64"]
https = "auth"

[requirements.ram]
min = 1024
recommended = 2048

[[ports]]
name = "http"
# The user-facing container is Element's nginx which serves on 8080 under
# rootless podman (can't bind :80 without privileges). Caddy targets this
# via the service name.
container_port = 8080

# Note: UID=0 / GID=0 for the synapse container live in its quadlet as
# Environment= directives, not here — putting UID in .env clashes with
# bash's readonly $UID when test steps source the file.

# --- Server identity ---

[[env]]
name = "SYNAPSE_SERVER_NAME"
value = "{{ service.domain | default('localhost')}}"

[[env]]
name = "SYNAPSE_PUBLIC_BASEURL"
value = "{{ service.external_url}}"

[[env]]
name = "SERVICE_EXTERNAL_URL"
value = "{{ service.external_url}}"

# --- Database: bundled Postgres (default) or bring your own. ---
#     internal: the synapse-db.container sidecar (alias `db`); the POSTGRES_*
#         init vars and synapse's homeserver.yaml connection share the .env.
#         Synapse talks to the db over the podman network, so there's no
#         published port to gate.
#     external: the sidecar is never symlinked or pulled; point synapse at an
#         existing Postgres.
[[choice]]
name = "database"
prompt = "Database"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled Postgres (managed quadlet)"
quadlets = ["synapse-db.container"]
[[choice.option.env]]
name = "POSTGRES_DB"
value = "synapse"
[[choice.option.env]]
name = "POSTGRES_USER"
value = "synapse"
[[choice.option.env]]
name = "POSTGRES_PASSWORD"
value = "{{secret.db_password}}"
[[choice.option.env]]
name = "POSTGRES_HOST"
value = "db"
[[choice.option.env]]
name = "POSTGRES_PORT"
value = "5432"

[[choice.option]]
name = "external"
label = "External Postgres (bring your own)"
[[choice.option.env]]
name = "POSTGRES_HOST"
value = ""
kind = "required"
prompt = "Postgres host"
[[choice.option.env]]
name = "POSTGRES_PORT"
value = "5432"
kind = "prompted"
prompt = "Postgres port"
[[choice.option.env]]
name = "POSTGRES_USER"
value = "synapse"
kind = "prompted"
prompt = "Postgres username"
[[choice.option.env]]
name = "POSTGRES_DB"
value = "synapse"
kind = "prompted"
prompt = "Postgres database name"
[[choice.option.env]]
name = "POSTGRES_PASSWORD"
value = ""
kind = "required"
prompt = "Postgres password"

# --- Synapse crypto / auth secrets ---

[[env]]
name = "SYNAPSE_REGISTRATION_SHARED_SECRET"
value = "{{secret.registration_secret}}"

[[env]]
name = "SYNAPSE_MACAROON_SECRET"
value = "{{secret.macaroon_secret}}"

[[env]]
name = "SYNAPSE_FORM_SECRET"
value = "{{secret.form_secret}}"

[integrations]
auth = ["oidc"]
oidc_callbacks = ["/_synapse/client/oidc/callback"]
smtp = false
# File-level snapshot of postgres datadir (db/) + synapse data
# dir (data/, which holds the homeserver signing key + media
# store + uploaded attachments). Brief downtime on stop/start
# of the synapse stack.
backup = true

[backup]
paths = ["db", "data"]

[mappings.auth]
# Trigger config-render overlay and make credentials available to
# render-config.sh which assembles /data/conf.d/oidc.yaml.
OAUTH_CLIENT_ID = "{{ auth.client_id}}"
OAUTH_CLIENT_SECRET = "{{ auth.client_secret}}"
# Synapse validates the `iss` claim in tokens against this URL. Authelia
# advertises its external (HTTPS) URL as the issuer, so we must use that —
# the auth-bridge makes it reachable from within the synapse container.
AUTH_EXTERNAL_URL = "{{ auth.external_url}}"
