[service]
name = "openclaw"
description = "OpenClaw - self-hosted AI assistant gateway"
category = "automation"
tags = ["ai", "agents"]
url = "https://docs.openclaw.ai/"
architecture = ["amd64", "arm64"]

[requirements.ram]
min = 1024
recommended = 2048

[[ports]]
name = "gateway"
container_port = 18789

[[env]]
name = "OPENCLAW_GATEWAY_TOKEN"
value = "{{secret.gateway_token}}"

[[env]]
name = "ANTHROPIC_API_KEY"
value = ""
kind = "prompted"
prompt = "Anthropic API key (leave empty to skip)"

[[env]]
name = "OPENAI_API_KEY"
value = ""
kind = "prompted"
prompt = "OpenAI API key (leave empty to skip)"

[integrations]
auth = []
smtp = false

# Autoupdate hint (registry tooling only, the box never self-updates).
# Calver image tags with an optional build suffix (2026.3.13-1).
[autoupdate]
strategy = "registry-tags"
tag_regex = '^(\d+\.\d+\.\d+(?:-\d+)?)$'
