# openclaw tests — install only. Setup is the default add + wait.

[[tests]]
name = "openclaw"
services = ["openclaw"]
[[tests.checks]]
action = "http"
name = "http-responds"
url = "http://127.0.0.1:$SERVICE_PORT_GATEWAY"
service = "openclaw"
poll = { interval = 2, attempts = 30 }
timeout = 90
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/openclaw"
