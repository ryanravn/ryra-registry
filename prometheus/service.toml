[service]
name = "prometheus"
description = "Prometheus - metrics collection and time-series database"
category = "monitoring"
tags = ["metrics", "alerting"]
url = "https://prometheus.io/docs/"
architecture = ["amd64", "arm64"]

[requirements.ram]
min = 256
recommended = 512

[[ports]]
name = "http"
container_port = 9090

[capabilities]
provides = ["metrics-store"]

[integrations]
auth = []
smtp = false
# TSDB under data/, scrape targets under targets/. Stop, snapshot, start.
backup = true

[backup]
paths = ["data", "targets"]

# Autoupdate hint (registry tooling only, the box never self-updates).
# The capture keeps the v prefix because the image tag carries it.
[autoupdate]
strategy = "github-release"
repo = "prometheus/prometheus"
tag_regex = '^(v\d+\.\d+\.\d+)$'
