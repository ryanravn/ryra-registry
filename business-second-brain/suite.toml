[suite]
name = "business-second-brain"
description = "The team's external memory: seafile holds the library with real permissions and sharing, paperless-ngx archives and OCRs documents, twenty keeps the customer relationships, and synapse gives the team its own Matrix chat; SSO and mail wired where supported, ryra's own agent is the brain on top"

[defaults]
auth = true
smtp = true
backup = true

[[members]]
service = "seafile"

[[members]]
service = "paperless-ngx"

[[members]]
service = "twenty"

[[members]]
service = "synapse"
