# vikunja tests — basic install + SMTP delivery + OIDC browser flow.

# Basic install. Setup is the default add + wait; the checks are live-safe.
[[tests]]
name = "vikunja"
services = ["vikunja"]
[[tests.checks]]
action = "http"
name = "vikunja-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "vikunja"
poll = { interval = 2, attempts = 30 }
timeout = 90
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/vikunja"
timeout = 10

# SMTP: register a user — Vikunja's mailer sends a confirmation email
# on successful registration. Stays a lifecycle test: `mail` reads the
# inbucket fixture.
[[tests]]
name = "vikunja-smtp"
[[tests.steps]]
action = "add"
service = "caddy"
[[tests.steps]]
action = "wait"
service = "caddy"
[[tests.steps]]
action = "add"
service = "vikunja"
args = "--smtp=inbucket"
timeout = 300
[[tests.steps]]
action = "wait"
service = "vikunja"
[[tests.steps]]
action = "http"
name = "vikunja-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "vikunja"
poll = { interval = 2, attempts = 30 }
timeout = 90
[[tests.steps]]
action = "http"
name = "trigger-signup-email"
method = "post"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/api/v1/register"
service = "vikunja"
body = '{"username":"smtptest","email":"smtptest@example.com","password":"Testing-Smtp-123!"}'
timeout = 30
[[tests.steps]]
action = "mail"
name = "mail-delivered-to-inbucket"
mailbox = "smtptest"
timeout = 90

# OIDC browser flow. Explicit setup: adds carry args/env and there are
# three services. The login flow is live-safe.
[[tests]]
name = "vikunja-oidc"
browser = true
[[tests.setup]]
action = "add"
service = "caddy"
[[tests.setup]]
action = "wait"
service = "caddy"
[[tests.setup]]
action = "add"
service = "authelia"
args = "--url https://auth.internal:8443"
env = { AUTHELIA_ADMIN_USER = "testuser", AUTHELIA_ADMIN_PASSWORD = "testpassword123" }
timeout = 300
[[tests.setup]]
action = "wait"
service = "authelia"
[[tests.setup]]
action = "add"
service = "vikunja"
args = "--auth"
timeout = 300
[[tests.setup]]
action = "wait"
service = "vikunja"
[[tests.checks]]
action = "http"
name = "vikunja-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "vikunja"
poll = { interval = 2, attempts = 20 }
timeout = 60
[[tests.checks]]
action = "playwright"
name = "playwright-auth-flow"
spec = "vikunja-auth.spec.ts"
timeout = 120
env = { AUTHELIA_USER = "testuser", AUTHELIA_PASSWORD = "testpassword123" }
