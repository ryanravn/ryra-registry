# uptime-kuma tests — install only. Setup is the default add + wait.

[[tests]]
name = "uptime-kuma"
[[tests.checks]]
action = "http"
name = "http-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "uptime-kuma"
poll = { interval = 2, attempts = 20 }
timeout = 60
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/uptime-kuma"
