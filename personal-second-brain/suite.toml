[suite]
name = "personal-second-brain"
description = "Your external memory: seafile holds your libraries (per-device selective sync, web editing, share links; encrypted libraries stay yours alone) and paperless-ngx archives and OCRs documents; ryra's own agent is the brain on top"

[defaults]
# SSO where members support it (paperless-ngx); seafile's own accounts
# stay primary for sync clients. Outbound app mail (share invites,
# resets) is captured by the local sink until a real relay is configured.
auth = true
smtp = true
backup = true

[[members]]
service = "seafile"

[[members]]
service = "paperless-ngx"
