# The personal second-brain suite, both modes from one definition.
# Sandbox/VM: the setup bracket is the real `ryra suite add
# personal-second-brain` plus a wait per member. Live: the checks run
# against the real installs, nothing installed or removed.
[[tests]]
name = "suite-personal-second-brain"
ram = 4096
suite = "personal-second-brain"

[[tests.checks]]
action = "http"
name = "seafile-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "seafile"
poll = { interval = 3, attempts = 60 }
timeout = 240

[[tests.checks]]
action = "http"
name = "paperless-responds"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP"
service = "paperless-ngx"
poll = { interval = 3, attempts = 40 }
timeout = 180
