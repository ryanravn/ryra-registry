[service]
name = "forgejo"
description = "Forgejo - self-hosted Git forge"
url = "https://forgejo.org/docs/"
architecture = ["amd64", "arm64"]
https = "auth"

[requirements.ram]
min = 256
recommended = 512

[[ports]]
name = "http"
container_port = 3000

# --- Database: bundled Postgres (default) or bring your own. ---
#     internal: the forgejo-postgres.container sidecar (alias `postgres`); the
#         POSTGRES_* init vars and forgejo's connection share the one .env.
#     external: the sidecar is never symlinked or pulled; point forgejo at an
#         existing Postgres.
[[env]]
name = "FORGEJO__database__DB_TYPE"
value = "postgres"

[[choice]]
name = "database"
prompt = "Database"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled Postgres (managed sidecar)"
quadlets = ["forgejo-postgres.container"]
# Container-init vars, read by the sidecar from the shared .env.
[[choice.option.env]]
name = "POSTGRES_USER"
value = "forgejo"
[[choice.option.env]]
name = "POSTGRES_PASSWORD"
value = "{{secret.db_password}}"
[[choice.option.env]]
name = "POSTGRES_DB"
value = "forgejo"
# Forgejo's connection, pointed at the sidecar.
[[choice.option.env]]
name = "FORGEJO__database__HOST"
value = "postgres:5432"
[[choice.option.env]]
name = "FORGEJO__database__NAME"
value = "forgejo"
[[choice.option.env]]
name = "FORGEJO__database__USER"
value = "forgejo"
[[choice.option.env]]
name = "FORGEJO__database__PASSWD"
value = "{{secret.db_password}}"

[[choice.option]]
name = "external"
label = "External Postgres (bring your own)"
[[choice.option.env]]
name = "FORGEJO__database__HOST"
value = ""
kind = "required"
prompt = "Postgres host:port (e.g. db.example.com:5432)"
[[choice.option.env]]
name = "FORGEJO__database__NAME"
value = "forgejo"
kind = "prompted"
prompt = "Postgres database name"
[[choice.option.env]]
name = "FORGEJO__database__USER"
value = "forgejo"
kind = "prompted"
prompt = "Postgres username"
[[choice.option.env]]
name = "FORGEJO__database__PASSWD"
value = ""
kind = "required"
prompt = "Postgres password"

# --- Forgejo env vars ---

[[env]]
name = "FORGEJO__server__DOMAIN"
value = "localhost"

[[env]]
name = "FORGEJO__server__ROOT_URL"
value = "{{service.external_url}}/"

[[env]]
name = "FORGEJO__service__DISABLE_REGISTRATION"
value = "true"

[[env]]
name = "FORGEJO__security__INSTALL_LOCK"
value = "true"

[integrations]
auth = ["oidc"]
oidc_callbacks = ["/user/oauth2/Authelia/callback"]
smtp = true
# File-level backup of db-data (postgres) + data (git repos + LFS +
# avatars). Same pattern as supabase/nextcloud — stop the stack,
# restic snapshots the raw volumes, restart. Avoids the pg_dumpall
# init-script-vs-replay conflicts entirely.
backup = true

[backup]
paths = ["db-data", "data"]

[mappings.auth]
FORGEJO__openid__ENABLE_OPENID_SIGNIN = "true"
FORGEJO__service__ENABLE_OPENID_SIGNIN = "true"
FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES = "openid email profile"
FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION = "true"
FORGEJO__oauth2_client__ENABLE_OPENID_CONNECT_INSECURE_SKIP_VERIFY = "true"
OIDC_CLIENT_ID = "{{auth.client_id}}"
OIDC_CLIENT_SECRET = "{{auth.client_secret}}"
OIDC_DISCOVERY_URL = "{{auth.issuer}}/.well-known/openid-configuration"
OIDC_AUTH_URL = "{{auth.external_url}}/api/oidc/authorization"
OIDC_TOKEN_URL = "{{auth.internal_url}}/api/oidc/token"
OIDC_PROFILE_URL = "{{auth.internal_url}}/api/oidc/userinfo"

[mappings.smtp]
FORGEJO__mailer__ENABLED = "true"
FORGEJO__mailer__SMTP_ADDR = "{{smtp.host}}"
FORGEJO__mailer__SMTP_PORT = "{{smtp.port}}"
FORGEJO__mailer__USER = "{{smtp.username}}"
FORGEJO__mailer__PASSWD = "{{smtp.password}}"
FORGEJO__mailer__FROM = "{{smtp.from}}"
FORGEJO__mailer__PROTOCOL = "{{smtp.security | forgejo_protocol}}"
FORGEJO__service__ENABLE_NOTIFY_MAIL = "true"
