[service]
name = "ente"
description = "Ente - end-to-end encrypted photo storage and 2FA"
category = "media"
tags = ["photos", "encryption"]
url = "https://ente.io"
architecture = ["amd64", "arm64"]

[requirements.ram]
min = 512
recommended = 1024

# Museum API. Over Tailscale it answers at https://<svc>.<tailnet>.ts.net:8080;
# the browser SPA is pointed here via ENTE_API_ORIGIN below.
[[ports]]
name = "http"
container_port = 8080
tailscale_https = 8080

# Photos web UI — the web root. Over Tailscale it answers at the bare
# https://<svc>.<tailnet>.ts.net (443), matching the seafile/authelia convention.
[[ports]]
name = "photos"
container_port = 3000
tailscale_https = 443

[[ports]]
name = "albums"
container_port = 3002

[[ports]]
name = "auth"
container_port = 3003

# --- Database: bundled Postgres (default) or bring your own. ---
#     internal: the ente-postgres.container sidecar (alias `postgres`); the
#         POSTGRES_* init vars and museum's ENTE_DB_* connection share the .env.
#     external: the sidecar is never symlinked or pulled; point museum at an
#         existing Postgres.
[[choice]]
name = "database"
prompt = "Database"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled Postgres (managed sidecar)"
quadlets = ["ente-postgres.container"]
# Container-init vars, read by the sidecar from the shared .env.
[[choice.option.env]]
name = "POSTGRES_USER"
value = "pguser"
[[choice.option.env]]
name = "POSTGRES_PASSWORD"
value = "{{secret.db_password}}"
[[choice.option.env]]
name = "POSTGRES_DB"
value = "ente_db"
# Museum's connection, pointed at the sidecar.
[[choice.option.env]]
name = "ENTE_DB_HOST"
value = "postgres"
[[choice.option.env]]
name = "ENTE_DB_PORT"
value = "5432"
[[choice.option.env]]
name = "ENTE_DB_NAME"
value = "ente_db"
[[choice.option.env]]
name = "ENTE_DB_USER"
value = "pguser"
[[choice.option.env]]
name = "ENTE_DB_PASSWORD"
value = "{{secret.db_password}}"
[[choice.option.env]]
name = "ENTE_DB_SSLMODE"
value = "disable"

[[choice.option]]
name = "external"
label = "External Postgres (bring your own)"
[[choice.option.env]]
name = "ENTE_DB_HOST"
value = ""
kind = "required"
prompt = "Postgres host"
[[choice.option.env]]
name = "ENTE_DB_PORT"
value = "5432"
kind = "prompted"
prompt = "Postgres port"
[[choice.option.env]]
name = "ENTE_DB_NAME"
value = "ente_db"
kind = "prompted"
prompt = "Postgres database name"
[[choice.option.env]]
name = "ENTE_DB_USER"
value = "pguser"
kind = "prompted"
prompt = "Postgres username"
[[choice.option.env]]
name = "ENTE_DB_PASSWORD"
value = ""
kind = "required"
prompt = "Postgres password"
[[choice.option.env]]
name = "ENTE_DB_SSLMODE"
value = "disable"
kind = "prompted"
prompt = "Postgres SSL mode (disable, require, verify-full)"

# --- Object storage: bundled MinIO (default) or bring your own S3. ---
#     internal: the ente-minio.container sidecar (alias `minio`) with a
#         published, browser-reachable port; museum signs presigned URLs
#         against it and the three S3 "providers" all point at it.
#     external: the sidecar is never symlinked or pulled (no minio port);
#         point all three providers at one existing S3-compatible store.
[[choice]]
name = "storage"
prompt = "Object storage"
default = "internal"

[[choice.option]]
name = "internal"
label = "Bundled MinIO (managed quadlet)"
quadlets = ["ente-minio.container"]
# MinIO S3 object storage. Ente uploads/downloads go *directly* from the
# browser to S3, so MinIO must be browser-reachable. Over Tailscale it answers
# at https://<svc>.<tailnet>.ts.net:3200; museum signs presigned URLs against
# this same host (and reaches it too). The S3 endpoint below points here.
[[choice.option.ports]]
name = "minio"
container_port = 3200
tailscale_https = 3200
[[choice.option.env]]
name = "MINIO_ROOT_USER"
value = "{{secret.minio_user}}"
format = "hex"
[[choice.option.env]]
name = "MINIO_ROOT_PASSWORD"
value = "{{secret.minio_password}}"
# S3 storage — all three "providers" point to the local MinIO instance.
# Ente museum requires all three to be configured even for self-hosted.
[[choice.option.env]]
name = "ENTE_S3_ARE_LOCAL_BUCKETS"
value = "true"
[[choice.option.env]]
name = "ENTE_S3_USE_PATH_STYLE_URLS"
value = "true"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_KEY"
value = "{{secret.minio_user}}"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_SECRET"
value = "{{secret.minio_password}}"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_ENDPOINT"
value = "{{service.port_url.minio}}"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_REGION"
value = "eu-central-2"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_BUCKET"
value = "b2-eu-cen"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_KEY"
value = "{{secret.minio_user}}"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_SECRET"
value = "{{secret.minio_password}}"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_ENDPOINT"
value = "{{service.port_url.minio}}"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_REGION"
value = "eu-central-2"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_BUCKET"
value = "wasabi-eu-central-2-v3"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_COMPLIANCE"
value = "false"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_KEY"
value = "{{secret.minio_user}}"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_SECRET"
value = "{{secret.minio_password}}"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_ENDPOINT"
value = "{{service.port_url.minio}}"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_REGION"
value = "eu-central-2"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_BUCKET"
value = "scw-eu-fr-v3"

[[choice.option]]
name = "external"
label = "External S3 (bring your own)"
# No MinIO sidecar, no published port. All three "providers" point at one
# external S3-compatible store. Ente museum requires all three configured.
[[choice.option.env]]
name = "ENTE_S3_ARE_LOCAL_BUCKETS"
value = "false"
[[choice.option.env]]
name = "ENTE_S3_USE_PATH_STYLE_URLS"
value = "true"
kind = "prompted"
prompt = "Use path-style S3 URLs (true/false)"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_KEY"
value = ""
kind = "required"
prompt = "S3 access key"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_SECRET"
value = ""
kind = "required"
prompt = "S3 secret key"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_ENDPOINT"
value = ""
kind = "required"
prompt = "S3 endpoint URL"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_REGION"
value = "eu-central-2"
kind = "prompted"
prompt = "S3 region"
[[choice.option.env]]
name = "ENTE_S3_B2_EU_CEN_BUCKET"
value = "b2-eu-cen"
kind = "prompted"
prompt = "S3 bucket name"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_KEY"
value = ""
kind = "required"
prompt = "S3 access key"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_SECRET"
value = ""
kind = "required"
prompt = "S3 secret key"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_ENDPOINT"
value = ""
kind = "required"
prompt = "S3 endpoint URL"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_REGION"
value = "eu-central-2"
kind = "prompted"
prompt = "S3 region"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_BUCKET"
value = "wasabi-eu-central-2-v3"
kind = "prompted"
prompt = "S3 bucket name"
[[choice.option.env]]
name = "ENTE_S3_WASABI_EU_CENTRAL_2_V3_COMPLIANCE"
value = "false"
kind = "prompted"
prompt = "Wasabi compliance mode (true/false)"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_KEY"
value = ""
kind = "required"
prompt = "S3 access key"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_SECRET"
value = ""
kind = "required"
prompt = "S3 secret key"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_ENDPOINT"
value = ""
kind = "required"
prompt = "S3 endpoint URL"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_REGION"
value = "eu-central-2"
kind = "prompted"
prompt = "S3 region"
[[choice.option.env]]
name = "ENTE_S3_SCW_EU_FR_V3_BUCKET"
value = "scw-eu-fr-v3"
kind = "prompted"
prompt = "S3 bucket name"

# --- Museum (API server) ---

# Browser-facing museum endpoint. The ente-io/web image bakes a placeholder
# into its static JS at build time and rewrites it to $ENTE_API_ORIGIN on
# container start — so this must be the URL the *browser* reaches museum at,
# not the in-network `museum:8080`. Resolves to the museum port's public URL
# in every mode: loopback (host only), the raw `--url` (e.g. a tailnet IP), or
# — with `--tailscale` — https://<svc>.<tailnet>.ts.net:8080 while the bare
# hostname serves the Photos UI.
[[env]]
name = "ENTE_API_ORIGIN"
value = "{{service.port_url.http}}"

# Ente's libsodium keys: base64 of an exact byte count (encryption=32, hash=64),
# matching `openssl rand -base64 N`. Museum base64-decodes these and rejects any
# other length with "invalid key length" (which blocks email verification). A
# plain string/hex secret decodes to the wrong size — must be `base64`.
[[env]]
name = "ENTE_KEY_ENCRYPTION"
value = "{{secret.key_encryption}}"
format = "base64"
length = 32

[[env]]
name = "ENTE_KEY_HASH"
value = "{{secret.key_hash}}"
format = "base64"
length = 64

# jwt.secret is decoded with Go's URL-safe base64 (rejects +/), unlike the two
# keys above (standard base64) — see museum main.go.
[[env]]
name = "ENTE_JWT_SECRET"
value = "{{secret.jwt_secret}}"
format = "base64_url"
length = 32

[[env]]
name = "ENTE_CREDENTIALS_FILE"
value = ""

[backup]
# Cold backup: backup-pre.sh stops the stack so postgres flushes WAL and
# the MinIO object store is quiescent, then restic copies the consistent
# db-data (account/file metadata) + minio-data (the E2E-encrypted photo
# objects). restore-post.sh sequences postgres + minio up before museum.
# Rendered config is regenerated on install, so only the two data dirs
# are captured. (Ente is client-side encrypted; the server backup is just
# the DB + object store — there is no separate Ente backup tool.)
paths = ["db-data", "minio-data"]

[integrations]
auth = []
smtp = true
backup = true

# Museum sends account-verification and login OTP codes by email. Without
# SMTP these only appear in the museum logs; with it, signup/login codes are
# delivered to the user's inbox. Wired to the global SMTP relay — toggle per
# install with `ryra configure ente --smtp` / `--no-smtp`. (Password recovery
# itself is the client-side recovery key, not an email flow — Ente is E2E.)
[mappings.smtp]
ENTE_SMTP_HOST = "{{smtp.host}}"
ENTE_SMTP_PORT = "{{smtp.port}}"
ENTE_SMTP_USERNAME = "{{smtp.username}}"
ENTE_SMTP_PASSWORD = "{{smtp.password}}"
ENTE_SMTP_EMAIL = "{{smtp.from}}"
ENTE_SMTP_ENCRYPTION = "{{ smtp.security | ente_smtp_encryption }}"
