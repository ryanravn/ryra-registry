# MinIO tests — install assertion + health probe.
# The integration with `ryra backup` is exercised by the `backup-minio`
# lifecycle test in registry/tests/. Setup is the default add + wait.

[[tests]]
name = "minio"
[[tests.checks]]
action = "http"
name = "health-live"
url = "http://127.0.0.1:$SERVICE_PORT_HTTP/minio/health/live"
service = "minio"
poll = { interval = 2, attempts = 30 }
timeout = 90
[[tests.checks]]
action = "shell"
name = "data-dir-created"
run = "test -d ${RYRA_DATA_DIR:-$HOME/.local/share/services}/minio/data"
